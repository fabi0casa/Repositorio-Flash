<html><head>
		<link rel="icon" href="media/images/flash.png">
		<link rel="stylesheet" media="screen" href="https://fontlibrary.org/face/minecraftia" type="text/css"/>
		<link rel="stylesheet" href="css/style.css">
		<title>Repositório Flash</title>
		<script src="js/script.js" defer></script>
		<script src="js/header.js" defer></script>
	</head>
	<body>
		<div id="header"></div>
		<div class="notificacao">
			<div class="mensagem">
				Bem-vindo! Clique em qualquer imagem para acessar o jogo correspondente.<br><br>
			</div>
		</div>

		<div class="game-controls">
			<button id="btn-sort-az" class="minecraft-btn" type="button" title="Ordenar de A a Z">A-Z</button>
			<button id="btn-sort-za" class="minecraft-btn" type="button" title="Ordenar de Z a A">Z-A</button>
			<button id="btn-shuffle" class="minecraft-btn" type="button" title="Reembaralhar jogos">Reembaralhar</button>
			<button id="btn-random-game" class="minecraft-btn" type="button" title="Jogar um jogo aleatório">Jogo Aleatório</button>
		</div>

		<div align="center">
			<div id="forms-container"></div>
		</div>

		<script type="module">
			import flash_games from './js/data-flash.js';
			import shockwave_games from './js/data-shockwave.js';
	
			const container = document.getElementById('forms-container');

			// Unifica os jogos misturando Flash e Shockwave com seus respectivos tipos
			const allGames = [
				...flash_games.map(name => ({ name, type: 'flash' })),
				...shockwave_games.map(name => ({ name, type: 'shockwave' }))
			];

			let currentGames = [];

			// Algoritmo Fisher-Yates para embaralhar uniformemente
			function shuffle(array) {
				const arr = [...array];
				for (let i = arr.length - 1; i > 0; i--) {
					const j = Math.floor(Math.random() * (i + 1));
					[arr[i], arr[j]] = [arr[j], arr[i]];
				}
				return arr;
			}
	
			function createGameForm(item, type, index) {
				// Cria um wrapper para o formulário
				const formWrapper = document.createElement('div');
				formWrapper.className = 'form-wrapper';

				// Cria o formulário
				const form = document.createElement('form');
				form.id = `form-${type}-${index}`; // ID único para cada formulário
				form.addEventListener('submit', function(e) {
					e.preventDefault(); // Evita o envio padrão do formulário
					const input = form.querySelector('input[type="hidden"]');
					const userInput = input.value;
					// Redireciona para jogo.html com o tipo correspondente na query string
					window.location.href = `jogo.html?${type}=` + encodeURIComponent(userInput);
				});

				// Cria o botão
				const button = document.createElement('button');
				button.className = 'transparent-button';
				button.type = 'submit'; // Define o botão como tipo submit

				// Cria a imagem
				const img = document.createElement('img');
				if (type === 'flash') {
					img.src = `media/thumbs/flash/${item}.jpeg`;
					img.onerror = () => {
						if (!img.dataset.fallback) {
							img.dataset.fallback = 'true';
							img.src = `media/thumbs/flash/${item}.png`;
						}
					};
				} else {
					img.src = `media/thumbs/shockwave/${item}.png`;
					img.onerror = () => {
						if (!img.dataset.fallback) {
							img.dataset.fallback = 'true';
							img.src = `media/thumbs/shockwave/${item}.jpeg`;
						}
					};
				}
				img.width = 150;
				img.height = 150;
				button.appendChild(img);

				// Cria o badge indicativo do tipo de jogo
				const badge = document.createElement('img');
				badge.className = 'game-badge';
				badge.src = type === 'flash' ? 'media/images/flash-icon.png' : 'media/images/shockwave.png';
				badge.alt = type === 'flash' ? 'Flash' : 'Shockwave';
				badge.title = type === 'flash' ? 'Jogo Flash' : 'Jogo Shockwave';
				button.appendChild(badge);

				// Cria o título
				const h3 = document.createElement('h3');
				h3.innerHTML = `<b>${item}</b>`;
				button.appendChild(h3);

				// Cria o input escondido
				const input = document.createElement('input');
				input.type = 'hidden';
				input.id = `input-${type}-${index}`; // ID único para cada input
				input.value = item;
				form.appendChild(input);

				form.appendChild(button);
				formWrapper.appendChild(form);
				container.appendChild(formWrapper);
			}

			function renderGames(games) {
				container.innerHTML = '';
				games.forEach((game, index) => {
					createGameForm(game.name, game.type, index);
				});
			}

			// Botão 1: Ordenação alfabética (A-Z)
			document.getElementById('btn-sort-az').addEventListener('click', () => {
				currentGames.sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));
				renderGames(currentGames);
			});

			// Botão 2: Ordenação alfabética reversa (Z-A)
			document.getElementById('btn-sort-za').addEventListener('click', () => {
				currentGames.sort((a, b) => b.name.localeCompare(a.name, 'pt-BR', { sensitivity: 'base' }));
				renderGames(currentGames);
			});

			// Botão 3: Reembaralha todos os jogos novamente
			document.getElementById('btn-shuffle').addEventListener('click', () => {
				currentGames = shuffle(currentGames);
				renderGames(currentGames);
			});

			// Botão 4: Abre diretamente um jogo aleatório
			document.getElementById('btn-random-game').addEventListener('click', () => {
				const randomGame = allGames[Math.floor(Math.random() * allGames.length)];
				window.location.href = `jogo.html?${randomGame.type}=` + encodeURIComponent(randomGame.name);
			});

			// Ao carregar a página: exibe todos os jogos em ordem totalmente aleatória misturando Flash e Shockwave
			currentGames = shuffle(allGames);
			renderGames(currentGames);
		</script>	

		<div class="footer">
			Feito por: Fábio Casagrande
		</div>
	
</body>
</html>
