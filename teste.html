<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste Shockwave - Bob Esponja: Flip or Flop</title>
  <!-- Polyfill do DirPlayer para emulação de Shockwave / Director -->
  <script src="js/dirplayer/dirplayer-polyfill.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      margin-bottom: 12px;
      font-size: 1.4rem;
    }
    .game-container {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
  <h1>SpongeBob - Flip or Flop (DirPlayer Test)</h1>
  <div class="game-container">
    <object width="800" height="600"
            data="media/jogos/shockwave/SpongeBob Flip or Flop/fliporflop.dcr"
            type="application/x-director">
      <param name="src" value="media/jogos/shockwave/SpongeBob Flip or Flop/fliporflop.dcr">
      <param name="sw1" value="media/jogos/shockwave/SpongeBob Flip or Flop/nick_intro09.dcr">
      <param name="sw2" value="media/jogos/shockwave/SpongeBob Flip or Flop/close_nick_sb.dcr">
      <embed src="media/jogos/shockwave/SpongeBob Flip or Flop/SpongeBob Flip or Flop.dcr"
             type="application/x-director"
             width="800"
             height="600"
             sw1="media/jogos/shockwave/SpongeBob Flip or Flop/nick_intro09.dcr"
             sw2="media/jogos/shockwave/SpongeBob Flip or Flop/close_nick_sb.dcr">
      </embed>
      <p style="color: white; padding: 20px;">
        Se você está vendo isso, o DirPlayer não carregou o jogo.
      </p>
    </object>
  </div>
</body>
</html>
